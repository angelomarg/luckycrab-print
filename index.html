<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Lucky Crab Epson Test</title>

    <script src="epos-2.27.0.js"></script>
</head>

<body>

<h1>Lucky Crab</h1>

<button onclick="imprimir()">
    Imprimir Prueba
</button>

<script>

function imprimir(){

    alert("Inicio");

    var ePosDev = new epson.ePOSDevice();

    ePosDev.connect(
        "10.140.1.237",
        8043,

        function(result){

            alert("Conexión: " + result);

            alert("Antes createDevice");

            ePosDev.createDevice(
                "local_printer",
                ePosDev.DEVICE_TYPE_PRINTER,
                {crypto:true, buffer:false},

                function(printerObj, result){

                    alert("Entró al callback");

                    alert("Resultado: " + result);
                    alert("Enviando ticket...");

printerObj.send();

alert("SEND ejecutado");

printerObj.onreceive = function(res){
    alert("Recibido: " + JSON.stringify(res));
};
                }
            );

            alert("Después createDevice");
        }
    );
}

</script>

</body>

</html>
